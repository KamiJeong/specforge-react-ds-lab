version: 1
description: Project-owned mechanical checks executed by sdd-verify.
commands:
  - id: typecheck
    command: bun run typecheck
    required: true
    timeout_seconds: 300
    profiles: [component, full]
  - id: component-tests
    command: bun run test
    required: true
    timeout_seconds: 300
    profiles: [component, full]
  - id: library-build
    command: bun run build
    required: true
    timeout_seconds: 300
    profiles: [component, full]
  - id: storybook-build
    command: bun run build-storybook
    required: true
    timeout_seconds: 600
    profiles: [component, full]

profiles:
  quick:
    scope: targeted
    description: Run only changed-package or Brief-approved checks during the compact loop.
  component:
    scope: targeted
    description: Run component-focused lint, typecheck, tests, and interaction/accessibility checks when configured.
  full:
    scope: full
    description: Run every required project check in declared order.

# Commands are package-root Bun scripts added by TASK-1-001. They cover the
# TypeScript library, component tests, distributable build, and Storybook build.

# Add project commands in execution order. Example:
# commands:
#   - id: format-check
#     command: ./project-specific-format-check
#     required: true
#     timeout_seconds: 300
#   - id: test
#     command: ./project-specific-test-command
