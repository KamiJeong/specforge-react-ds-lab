version: 1
name: SpecForge V1
state_schema: .sdd/schemas/workflow-state.schema.json
initial_stage: intake
terminal_stage: ready-pr
review_iteration_limit: 2
state_authority: specs/<correlation>-<slug>/state.json

orchestrator:
  model: gpt-5.6-terra
  reasoning: medium
  actor: specforge-orchestrator/v1

profiles:
  quick:
    description: Low-risk, local, reversible changes with no external contract or sensitive boundary impact.
    initial_stage: spec
    route: [spec, implement, verify, review, ready-pr]
    retry_route: [review, fix, verify, review]
    brief_artifact: brief.md
    delivery_artifact: delivery.md
    verification_scope: targeted
    knowledge_validation_checkpoints: [after-brief, before-ready-pr]
  component:
    description: Shared UI component work that needs API, state, interaction, visual, and accessibility evaluation.
    initial_stage: spec
    route: [spec, implement, verify, eval, review, ready-pr]
    retry_route: [review, fix, verify, eval, review]
    brief_artifact: brief.md
    delivery_artifact: delivery.md
    verification_scope: targeted
    knowledge_validation_checkpoints: [after-brief, before-ready-pr]
  full:
    description: High-risk, cross-boundary, externally contracted, or otherwise complex delivery.
    initial_stage: intake
    route: [intake, spec, clarify, eval-design, plan, tasks, analyze, implement, verify, eval, review, converge, ready-pr]
    retry_route: [review, fix, verify, eval, review]
    verification_scope: full
    knowledge_validation_checkpoints: [after-major-artifacts, during-analyze, before-converge, before-ready-pr]

profile_selection:
  precedence: [explicit-cli, single-workflow-label, automatic-risk-classification]
  labels: [workflow:quick, workflow:component, workflow:full]
  default: component
  promote_to_full_when:
    - authentication, authorization, cryptography, or security boundary
    - sensitive data, persistence, schema, or irreversible migration
    - externally published or relied-upon API compatibility
    - cross-service or cross-package architecture change
    - critical performance budget or significant infrastructure cost
    - Constitution exception or unresolved product semantics
  notes:
    - An internal design-system component API is not by itself an external public API.
    - Conflicting profile labels or uncertain high-impact scope select full.

model_escalation:
  default: gpt-5.6-terra/medium
  use_sol_high_when:
    - a full-profile risk requires architecture or contract adjudication
    - security, data integrity, or irreversible migration decisions are unresolved
    - an externally published API break is proposed
    - complex failure analysis, disputed P0/P1 review, or final high-risk adjudication is required

stages:
  intake:
    skill: sdd-intake
    agent: architect
    artifact: issue.md
    pass_to: spec
  spec:
    skill: sdd-spec
    agent: architect
    artifact: spec.md
    pass_to: clarify
  clarify:
    skill: sdd-clarify
    agent: architect
    artifact: clarifications.md
    pass_to: eval-design
  eval-design:
    skill: sdd-eval-design
    agent: architect
    artifact: evals.md
    pass_to: plan
  plan:
    skill: sdd-plan
    agent: architect
    artifact: plan.md
    pass_to: tasks
  tasks:
    skill: sdd-tasks
    agent: architect
    artifact: tasks.md
    pass_to: analyze
    exit_checks: [knowledge-validate]
  analyze:
    skill: sdd-analyze
    agent: architect
    artifact: analysis.md
    read_only: true
    pass_to: implement
  implement:
    skill: sdd-implement
    agent: implementer
    pass_to: verify
  verify:
    skill: sdd-verify
    agent: evaluator
    artifact: verification.md
    pass_to: eval
  eval:
    skill: sdd-eval
    agent: evaluator
    artifacts: [eval-results.md, evidence/manifest.json]
    pass_to: review
  review:
    skill: sdd-review
    agent: reviewer
    artifact: review.md
    read_only_agent: true
    pass_to: converge
    fail_to: fix
  fix:
    skill: sdd-fix
    agent: fixer
    pass_to: verify
  converge:
    skill: sdd-converge
    agent: architect
    artifact: convergence.md
    pass_to: ready-pr
    entry_checks: [knowledge-validate]
  ready-pr:
    skill: sdd-pr
    agent: utility
    terminal: true
    entry_checks: [knowledge-validate, definition-of-done]

allowed_transitions:
  intake: [spec]
  spec: [clarify, implement]
  clarify: [spec, eval-design]
  eval-design: [clarify, spec, plan]
  plan: [clarify, spec, eval-design, tasks]
  tasks: [clarify, spec, eval-design, plan, analyze]
  analyze: [clarify, spec, eval-design, plan, tasks, implement]
  implement: [clarify, spec, eval-design, plan, tasks, verify]
  verify: [implement, fix, eval, review]
  eval: [implement, fix, eval-design, review]
  review: [fix, converge, ready-pr]
  fix: [clarify, spec, eval-design, plan, tasks, verify]
  converge: [clarify, spec, eval-design, plan, tasks, implement, verify, eval, review, fix, ready-pr]
  ready-pr: []

blocking_conditions:
  global:
    - invalid or unparseable state
    - unresolved authority conflict
    - required human decision
    - fabricated or insufficient evidence
  analyze:
    - any blocking analysis finding
  verify:
    - any required verification command fails or is not executed
  eval:
    - any blocking Eval is FAIL or BLOCKED
  review:
    - any open P0 or P1 finding
  converge:
    - any Definition of Done condition is unsatisfied

human_gates:
  labels: [gate:human-required, state:blocked, state:needs-info]
  decisions:
    - business behavior or product semantics
    - authentication, authorization, or security boundary
    - sensitive data handling
    - public API contract change
    - irreversible migration
    - significant infrastructure cost
    - Constitution exception
    - intentional Acceptance Criteria weakening
    - intentional blocking Eval change

retry_behavior:
  verification_failure: route to implement or fix according to review history
  eval_failure: route to implement or fix; use eval-design only for a recorded contract defect
  review_failure: route to fix, then verify, eval, and review
  review_fix_limit: 2
  on_limit: persist blocking question, apply gate:human-required, and stop

knowledge_validation_checkpoints:
  full:
    - after intake, spec, clarify, eval-design, plan, and tasks artifact generation
    - during analyze when useful
    - before converge
    - before ready-pr
  quick:
    - after compact brief generation
    - before ready-pr
  component:
    - after compact brief generation
    - before ready-pr

spike_route:
  stages: [intake, clarify, eval-design, analyze, converge, ready-pr]
  notes: Investigation evidence replaces production implementation unless the approved spike explicitly includes code.

pr_readiness_conditions:
  common:
    - implementation_status is complete, or the approved issue type is spike
    - verification_status is pass, or explicitly not applicable for an approved spike
    - open P0 findings equals 0
    - open P1 findings equals 0
    - no required human decision is open
    - final profile-appropriate knowledge validation passes
  quick:
    - spec_status is approved through brief.md
    - eval_design_status is not_applicable
    - analysis_status is not_applicable
    - eval_status is not_applicable
    - convergence_status is not_applicable
  component:
    - spec_status is approved through brief.md
    - eval_design_status is approved through brief.md
    - analysis_status is not_applicable
    - eval_status is pass
    - convergence_status is not_applicable
  full:
    - spec_status is approved
    - eval_design_status is approved
    - analysis_status is pass
    - eval_status is pass
    - convergence_status is pass
